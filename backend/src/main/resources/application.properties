server.port=8080

# MySQL connection. Override with environment variables if your setup differs.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/techmart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# The schema comes from database/schema.sql, so Hibernate only checks that it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Return JSON errors without stack traces
server.error.include-stacktrace=never

# ---- Part 2: database migrations (Flyway) ----
# Your Part 1 database already has tables but no Flyway history, so Flyway
# "baselines" it at version 1 (= the Part 1 schema) and then applies V2, V3, ...
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ---- Part 2: JWT authentication ----
# Override JWT_SECRET in real deployments (must be at least 32 characters).
app.jwt.secret=${JWT_SECRET:techmart-dev-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-ms=86400000

# ---- Part 3: logging and monitoring ----
spring.application.name=techmart-backend

# Expose only what is needed: /actuator/health and /actuator/prometheus
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# Every metric gets an application="techmart-backend" label
management.metrics.tags.application=techmart-backend
# Publish latency histogram buckets so Grafana can compute p50/p95/p99
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Controlled-failure endpoints (/api/debug/error, /api/debug/slow) for the monitoring demo.
# Set DEBUG_ENDPOINTS=false (or remove) to switch them off in a real deployment.
app.debug-endpoints.enabled=${DEBUG_ENDPOINTS:true}
