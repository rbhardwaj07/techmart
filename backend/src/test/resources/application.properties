# Test configuration: in-memory H2 database in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:techmart;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Part 2: the test schema comes from schema.sql, so Flyway is off here
spring.flyway.enabled=false
app.jwt.secret=test-secret-key-for-unit-tests-only-0123456789abcdef
app.jwt.expiration-ms=3600000

# Part 3
spring.application.name=techmart-backend
management.endpoints.web.exposure.include=health,prometheus
app.debug-endpoints.enabled=true
